summary: Launch workshop with openchamber-sdk and verify service configuration

execute: |
  set -eux

  echo "==> Create workshop.yaml referencing openchamber-sdk"
  cat > /tmp/workshop.yaml <<YAML
  name: openchamber-sdk-test
  base: {{base}}
  sdks:
    - name: opencode
    - name: try-openchamber-sdk
  YAML

  echo "==> Launch workshop with the SDK"
  workshop launch /tmp/workshop.yaml --wait-ready

  echo "==> Verify openchamber.service is active"
  workshop exec systemctl --user is-active openchamber.service

  echo "==> Verify password file exists and is non-empty"
  workshop exec test -f /project/.openchamber-password
  workshop exec test -s /project/.openchamber-password

  echo "==> Verify WorkingDirectory is patched to /project"
  workshop exec grep -q 'WorkingDirectory=/project' ~/.config/systemd/user/openchamber.service

  echo "==> Verify service listens on 0.0.0.0:3000"
  workshop exec ss -tlnp | grep -q '0.0.0.0:3000'

  echo "==> All checks passed"