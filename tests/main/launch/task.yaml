summary: Launch workshop with openchamber and verify service configuration

prepare: |
  echo "==> Create workshop.yaml referencing openchamber"
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch --verbose


restore: |
  workshop remove || true


debug: |
  workshop exec -- systemctl --user status --no-pager openchamber.service || true
  workshop exec -- journalctl --user --no-pager -n 100 -u openchamber.service || true
  workshop exec -- systemctl --user status --no-pager openchamber-opencode.service || true
  workshop exec -- journalctl --user --no-pager -n 100 -u openchamber-opencode.service || true


execute: |
  set -eux

  echo "==> Verify openchamber.service is active"
  workshop exec -- systemctl --user is-active openchamber.service

  echo "==> Verify password file exists and is non-empty"
  workshop exec -- test -f /project/.openchamber-password
  workshop exec -- test -s /project/.openchamber-password

  echo "==> Verify WorkingDirectory is set to /project"
  workshop exec -- sudo -u workshop grep -q 'WorkingDirectory=/project' /home/workshop/.config/systemd/user/openchamber.service

  echo "==> Verify service listens on 0.0.0.0:3000"
  # The server may still be starting right after launch; poll for up to 30s.
  listening=false
  for _ in $(seq 30); do
    if workshop exec -- ss -tlnp | grep -q '0.0.0.0:3000'; then
      listening=true
      break
    fi
    sleep 1
  done
  "$listening"

  echo "==> Verify memory limits from /project/openchamber-env.sh are applied"
  workshop exec -- bash -c 'printf "OPENCODE_MEM_MAX=1G\nOPENCODE_MEM_HIGH=768M\n" > /project/openchamber-env.sh'
  workshop exec -- systemctl --user restart openchamber-opencode.service
  workshop exec -- systemctl --user show -p MemoryMax --value openchamber-opencode.service | grep -qx 1073741824
  workshop exec -- systemctl --user show -p MemoryHigh --value openchamber-opencode.service | grep -qx 805306368
  workshop exec -- systemctl --user is-active openchamber-opencode.service

  echo "==> Verify memory limits reset when the env file is removed"
  workshop exec -- rm -f /project/openchamber-env.sh
  workshop exec -- systemctl --user restart openchamber-opencode.service
  workshop exec -- systemctl --user show -p MemoryMax --value openchamber-opencode.service | grep -qx infinity
  workshop exec -- systemctl --user show -p MemoryHigh --value openchamber-opencode.service | grep -qx infinity

  echo "==> All checks passed"
