name: Release to latest/edge

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download SDK artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-test.yml
          workflow_conclusion: success
          name: sdk-files
          path: dist

      - name: Install sdkcraft
        run: sudo snap install sdkcraft --classic

      - name: Upload and release to latest/edge
        env:
          SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
        run: |
          shopt -s nullglob
          for sdk in dist/*.sdk; do
            echo "Releasing $sdk to latest/edge"
            sdkcraft upload "$sdk" --release latest/edge
          done
